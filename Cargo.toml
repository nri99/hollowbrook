[package]
name = "hollowbrook"
version = "1.1.0"
edition = "2021"

[dependencies]
glam = { version = "0.27", features = ["serde"] }
macroquad = { version = "0.4", features = ["audio"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gilrs = "0.11"

[profile.release]
lto = "fat"
codegen-units = 1

# Fast iteration: `bash tools/quick.sh` (incremental, light optimisation; dependencies optimised once).
[profile.quick]
inherits = "dev"
opt-level = 1
debug = false
incremental = true

[profile.quick.package."*"]
opt-level = 2
